name: Monitor de todos os sites
on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor-sites
  cancel-in-progress: true

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Credenciais
        run: |
          cat > .env.robo <<'EOF'
          FIREBASE_SA_B64=${{ secrets.FIREBASE_SA_B64 }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EOF
      - name: Checar todos os sites
        run: node scripts/monitor-sites.js
