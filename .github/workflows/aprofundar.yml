# Freio de 14/10/2026 (decisão da Dani, para o site voltar ao Google): no máximo 3 matérias
# novas por dia somando todos os robôs, só em português, 600+ palavras com fato concreto.
# A regra mora em scripts/freio.js.
name: Aprofundar acervo
on:
  schedule:
    - cron: '30 15 * * *' # 12h30 em Brasília, uma vez por dia (era a cada 2 h)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aprofundar # grupo próprio: no grupo robos os alertas de 15 em 15 min cancelavam a rodada na fila
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev || npm install --omit=dev
      - name: Credenciais
        run: |
          cat > .env.robo <<'EOF'
          G_CLIENT_ID=${{ secrets.G_CLIENT_ID }}
          G_CLIENT_SECRET=${{ secrets.G_CLIENT_SECRET }}
          G_REFRESH_TOTAL=${{ secrets.G_REFRESH_TOTAL }}
          CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}
          HF_API_TOKEN=${{ secrets.HF_API_TOKEN }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2=${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          VAPID_PUBLIC=${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE=${{ secrets.VAPID_PRIVATE }}
          FIREBASE_SA_B64=${{ secrets.FIREBASE_SA_B64 }}
          EOF
      - name: Rodar
        env:
          SKIP_DEPLOY: '1'
        run: node scripts/enriquecer.js --piso 2000 --limite 2 --aplicar || true; node scripts/corrigir-forma.js --aplicar --limite 12 || true
      - name: Publicar conteúdo
        run: |
          git config user.name "Explosao Solar Bot"
          git config user.email "bot@explosaosolar.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Aprofundar acervo: conteúdo automático [skip ci]"
            ok=""
            for i in 1 2 3 4 5; do
              if git pull --rebase -q origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            [ -n "$ok" ]
          fi
