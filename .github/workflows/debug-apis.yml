name: Debug APIs de clima
on: workflow_dispatch
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Testar fontes
        run: |
          echo "== open-meteo sem UA:"
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 "https://api.open-meteo.com/v1/forecast?latitude=-23.55&longitude=-46.63&current=temperature_2m" || true
          echo "== open-meteo com UA navegador:"
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0.0.0 Safari/537.36" "https://api.open-meteo.com/v1/forecast?latitude=-23.55&longitude=-46.63&current=temperature_2m" || true
          echo "== corpo open-meteo com UA (200 chars):"
          curl -s --max-time 15 -A "Mozilla/5.0" "https://api.open-meteo.com/v1/forecast?latitude=-23.55&longitude=-46.63&current=temperature_2m" | head -c 200 || true
          echo ""
          echo "== met.no com UA identificada:"
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 -A "ExplosaoSolar/1.0 contato@explosaosolar.com" "https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=-23.55&lon=-46.63" || true
