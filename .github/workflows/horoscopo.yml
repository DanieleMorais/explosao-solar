name: Horóscopo do dia
on:
  schedule:
    # 05:20 BRT + repescagens; o robô sai sem fazer nada se o horóscopo de hoje já existe
    - cron: '20 8,12,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Grupo próprio: no grupo compartilhado "robos" este job de 1x/dia era expulso da fila
# pelos robôs frequentes (só 1 run pode aguardar por grupo) e ficou 4 dias sem publicar.
concurrency:
  group: horoscopo
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Credenciais
        run: |
          cat > .env.robo <<'EOF'
          CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}
          HF_API_TOKEN=${{ secrets.HF_API_TOKEN }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2=${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          EOF
      - name: Gerar horóscopo
        run: node scripts/robo-horoscopo.js
      - name: Publicar
        run: |
          git config user.name "Explosao Solar Bot"
          git config user.email "bot@explosaosolar.com"
          git add content/horoscopo.json
          if ! git diff --cached --quiet; then
            git commit -m "Horóscopo do dia [skip ci]"
            ok=""
            for i in 1 2 3 4 5; do
              if git pull --rebase -q origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            [ -n "$ok" ]
          fi
