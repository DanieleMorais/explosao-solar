name: Alertas de desastres
on:
  schedule:
    - cron: '*/15 * * * *' # a cada 15 min (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robos
  cancel-in-progress: false

jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev || npm install --omit=dev
      - name: Credenciais
        run: |
          cat > .env.robo <<'EOF'
          G_CLIENT_ID=${{ secrets.G_CLIENT_ID }}
          G_CLIENT_SECRET=${{ secrets.G_CLIENT_SECRET }}
          G_REFRESH_TOTAL=${{ secrets.G_REFRESH_TOTAL }}
          CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}
          HF_API_TOKEN=${{ secrets.HF_API_TOKEN }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2=${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          VAPID_PUBLIC=${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE=${{ secrets.VAPID_PRIVATE }}
          FIREBASE_SA_B64=${{ secrets.FIREBASE_SA_B64 }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EOF
      - name: Rodar robô de alertas
        env:
          SKIP_DEPLOY: '1'
        run: node scripts/robo-alertas.js || true
      - name: Publicar conteúdo
        run: |
          git config user.name "Explosao Solar Bot"
          git config user.email "bot@explosaosolar.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Alertas: monitoramento automático [skip ci]"
            ok=""
            for i in 1 2 3 4 5; do
              if git pull --rebase -q origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            [ -n "$ok" ]
            echo "MUDOU=1" >> $GITHUB_ENV
          fi
