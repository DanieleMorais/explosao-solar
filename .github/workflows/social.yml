name: Redes sociais
on:
  schedule:
    - cron: '0 11,23 * * *' # 2x/dia (8h e 20h BRT) — ritmo calmo p/ conta nova amadurecer
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Credenciais
        run: |
          cat > .env.robo <<'EOF'
          META_TOKEN=${{ secrets.META_TOKEN }}
          META_PAGE_ID=${{ secrets.META_PAGE_ID }}
          META_IG_ID=${{ secrets.META_IG_ID }}
          META_APP_ID=${{ secrets.META_APP_ID }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET }}
          EOF
      - name: Postar
        run: node scripts/social.js --max 1 || true
      - name: Salvar estado
        run: |
          git config user.name "Explosao Solar Bot"
          git config user.email "bot@explosaosolar.com"
          git add scripts/social-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Redes sociais: estado de publicacao [skip ci]"
            ok=""
            for i in 1 2 3 4 5; do
              if git pull --rebase -q origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            [ -n "$ok" ]
          fi
