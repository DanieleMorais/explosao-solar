name: Redes sociais
on:
  schedule:
    - cron: '30 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robos
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Credenciais
        run: |
          cat > .env.robo <<'EOF'
          META_TOKEN=${{ secrets.META_TOKEN }}
          META_PAGE_ID=${{ secrets.META_PAGE_ID }}
          META_IG_ID=${{ secrets.META_IG_ID }}
          EOF
      - name: Postar
        run: node scripts/social.js --max 3 || true
      - name: Salvar estado
        run: |
          git config user.name "Explosao Solar Bot"
          git config user.email "bot@explosaosolar.com"
          git add scripts/social-state.json
          if ! git diff --cached --quiet; then
            git pull --no-rebase -q origin main || true
            git commit -m "Redes sociais: estado de publicacao [skip ci]"
            git push
          fi
