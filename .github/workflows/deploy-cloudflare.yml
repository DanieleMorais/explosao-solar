name: Deploy Cloudflare
on:
  schedule:
    - cron: '5,25,45 * * * *' # a cada 20 min, pega o conteúdo novo dos robôs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build + Deploy na Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_GA_ID: G-RK56TFGW01 # id de medição é público (vai no HTML)
          NEXT_PUBLIC_ADSENSE_CLIENT: ca-pub-1623504542591354 # id de publisher é público (vai no HTML e no ads.txt)
        run: |
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare deploy
