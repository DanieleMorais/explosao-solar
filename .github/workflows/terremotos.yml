# Freio de 14/10/2026 (decisão da Dani, para o site voltar ao Google): no máximo 3 matérias
# novas por dia somando todos os robôs, só em português, 600+ palavras com fato concreto.
# A regra mora em scripts/freio.js.
name: Terremotos (USGS)
on:
  schedule:
    - cron: '30 */6 * * *' # a cada 6 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terremotos
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev || npm install --omit=dev
      - name: Credenciais
        run: |
          cat > .env.robo <<'EOF'
          CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}
          HF_API_TOKEN=${{ secrets.HF_API_TOKEN }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2=${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          EOF
      - name: Rodar
        env:
          SKIP_DEPLOY: '1'
        run: node scripts/robo-terremotos.js --max 1 || true
      - name: Publicar conteúdo
        run: |
          git config user.name "Explosao Solar Bot"
          git config user.email "bot@explosaosolar.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Terremotos USGS: conteúdo automático [skip ci]"
            ok=""
            for i in 1 2 3 4 5; do
              if git pull --rebase -q origin main; then
                # freio: outro robô pode ter publicado ao mesmo tempo; passou do limite do dia, este lote não sobe
                if ! node scripts/freio.js --conferir; then echo "Freio: limite de matérias do dia atingido, lote descartado"; ok=1; break; fi
                if git push; then ok=1; break; fi
              fi
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            [ -n "$ok" ]
          fi
